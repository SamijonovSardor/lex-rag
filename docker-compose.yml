# Local Postgres with pgvector for the index (Phase 2).
#   docker compose up -d db
# Host port 5434: 5432/5433 are often taken by a native PostgreSQL install.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lexrag-db
    environment:
      POSTGRES_USER: lexrag
      POSTGRES_PASSWORD: lexrag
      POSTGRES_DB: lexrag
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - lexrag_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "maintenance_work_mem=512MB"]
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexrag -d lexrag"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Phase 3. Off by default (it needs ~1.5 GB RAM):
  #   docker compose --profile airflow up -d --build     → http://127.0.0.1:8080
  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: lexrag-airflow
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://lexrag:lexrag@db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  # local only: no login page
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      # lean: a laptop with little free RAM; four DAGs need no more
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__API__WORKERS: "1"
      LEXRAG_DATA_DIR: /opt/airflow/lexrag-data
      # the index the DAGs update; point it at Neon to update production
      LEXRAG_DATABASE_URL: ${LEXRAG_AIRFLOW_DATABASE_URL:-postgresql://lexrag:lexrag@db:5432/lexrag}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/lexrag-data
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  lexrag_pgdata:
